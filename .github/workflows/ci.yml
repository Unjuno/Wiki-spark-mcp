name: MVP verification
on:
  push:
    branches: [main, completion/mvp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-spark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run site:build
      - run: npm audit --audit-level=high
  live:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - name: Live Wikipedia through actual MCP stdio transport
        env:
          WIKIMEDIA_CONTACT: https://github.com/Unjuno/Wiki-spark-mcp/issues
        run: npm run test:live
      - name: Print live evidence
        if: always()
        run: test ! -f verification/live-smoke.json || cat verification/live-smoke.json
